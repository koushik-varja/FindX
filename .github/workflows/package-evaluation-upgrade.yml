name: Package evaluation upgrade
on:
  push:
    branches: [evaluation-upgrade-20261006]
permissions:
  contents: read
jobs:
  validate-benchmark-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-full.txt
            backend/requirements-eval.txt
      - name: Install evaluation and Full ML dependencies
        run: |
          pip install -r backend/requirements-eval.txt
          pip install -r backend/requirements-full.txt
      - name: Backend lint and tests
        run: |
          ruff check --select E9,F63,F7,F82 backend ml evaluation scripts tests
          python scripts/check_format.py
          pytest -q
      - name: Build curated golden dataset
        run: python scripts/build_golden_dataset.py
      - name: Full ML integration test
        env:
          FINDX_RUN_FULL_INTEGRATION: "1"
        run: pytest -q -m full_ml
      - name: Full scientific benchmark and report
        run: python scripts/benchmark_retrieval.py --mode full --output-dir evaluation/results/full --latency-repeats 1 --concurrency 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend validation
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Final source hygiene scan
        run: |
          ! grep -RInE 'TODO|FIXME' --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv --exclude='package-lock.json' .
          ! grep -RInE '(password|secret|api[_-]?key)[[:space:]]*=[[:space:]]*["'"'][^$<{][^"'"']+' --include='*.py' --include='*.ts' --include='*.tsx' --include='*.yml' --include='*.yaml' . || false
      - name: Create final ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path('.').resolve()
          output = root / 'FindX-upgraded.zip'
          excluded_dirs = {'.git', '.venv', 'venv', 'node_modules', '__pycache__', '.pytest_cache', '.ruff_cache', 'dist'}
          excluded_prefixes = {
              Path('artifacts/index/full'),
              Path('evaluation/results/full/indexes'),
          }
          excluded_names = {'.env'}
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  if not path.is_file() or path == output:
                      continue
                  rel = path.relative_to(root)
                  if any(part in excluded_dirs for part in rel.parts):
                      continue
                  if rel.name in excluded_names:
                      continue
                  if any(rel == prefix or prefix in rel.parents for prefix in excluded_prefixes):
                      continue
                  if rel.suffix in {'.pyc', '.pyo'}:
                      continue
                  archive.write(path, Path('FindX') / rel)
          print(output, output.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: FindX-upgraded
          path: FindX-upgraded.zip
          if-no-files-found: error
