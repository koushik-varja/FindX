name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements-eval.txt
      - run: ruff check --select E9,F63,F7,F82 backend ml evaluation scripts tests
      - run: python scripts/check_format.py
      - run: pytest -q
      - run: python scripts/build_golden_dataset.py
      - run: python scripts/benchmark_retrieval.py --mode lightweight --output-dir /tmp/findx-evaluation --latency-repeats 1 --concurrency 2
      - run: alembic -c backend/alembic.ini upgrade head --sql > /tmp/findx-migration.sql
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: 'npm', cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
